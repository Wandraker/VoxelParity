name: VoxelParity
version: '${project.version}'
main: dev.onelsey.voxelparity.VoxelParityPlugin
api-version: '26.3'
folia-supported: true
author: Onelsey
description: Bedrock movement and collision parity fixes for modern Java Edition servers.
softdepend:
  - floodgate
  - Geyser-Spigot
commands:
  voxelparity:
    description: VoxelParity administration command
    aliases: [vp]
    usage: /voxelparity <status|modules|debug|reload>
    permission: voxelparity.admin
permissions:
  voxelparity.admin:
    description: Allows VoxelParity administration commands
    default: op
